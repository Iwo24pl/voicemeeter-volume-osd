name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name VoiceMeeterPopup
          --icon assets\icon.ico
          --add-data "assets;assets"
          --hidden-import pystray._win32
          main.py

      - name: Smoke test the executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\VoiceMeeterPopup.exe" -ArgumentList "--demo", "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self test failed with exit code $($p.ExitCode)" }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\VoiceMeeterPopup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  VoiceMeeterPopup.exe" | Out-File "dist\VoiceMeeterPopup.exe.sha256" -Encoding ascii
          Get-Content "dist\VoiceMeeterPopup.exe.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VoiceMeeterPopup.exe
            dist/VoiceMeeterPopup.exe.sha256
          generate_release_notes: true
